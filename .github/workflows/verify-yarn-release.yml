name: verify yarn release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Parse release tag
        # <channel>-<partnerId>-v<version> (dev-pronto-v0.2.0), or the legacy
        # unpartnered v<version> (v0.1.0-dev.9).
        run: |
          if [[ "$RELEASE_TAG" =~ ^(dev|prod)-([a-z0-9]+(-[a-z0-9]+)*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            channel="${BASH_REMATCH[1]}"
            partner="${BASH_REMATCH[2]}"
            version="${BASH_REMATCH[4]}"
          elif [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            channel=""
            partner=""
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::Unrecognised release tag '$RELEASE_TAG'. Expected <dev|prod>-<partnerId>-v<x.y.z> or v<version>."
            exit 1
          fi
          {
            echo "RELEASE_CHANNEL=$channel"
            echo "RELEASE_PARTNER=$partner"
            echo "RELEASE_VERSION=$version"
          } >> "$GITHUB_ENV"
          echo "tag=$RELEASE_TAG channel=${channel:-legacy} partner=${partner:-none} version=$version"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Create React Native host fixture
        run: |
          mkdir host
          cd host
          npm init -y
          npm pkg set private=true
          npm pkg set dependencies.react=19.2.0
          npm pkg set dependencies.react-native=0.83.0
          npm pkg set dependencies.react-native-blob-util=0.19.11

      - name: Install from GitHub Release
        working-directory: host
        run: |
          curl -fLO "https://github.com/keystonecommerce/liwip-commerce-sdk-releases/releases/download/${RELEASE_TAG}/liwip-store-install.mjs"
          if [ -n "$RELEASE_PARTNER" ]; then
            # A partner installer is baked with its own tag and nothing else.
            node liwip-store-install.mjs --print-release > installer-release.json
            node -e "const r=require('./installer-release.json'); const want={tag:process.env.RELEASE_TAG, channel:process.env.RELEASE_CHANNEL, partnerId:process.env.RELEASE_PARTNER, version:process.env.RELEASE_VERSION}; for (const [k,v] of Object.entries(want)) if (r[k] !== v) throw new Error('installer '+k+' is '+r[k]+', expected '+v);"
          fi
          node liwip-store-install.mjs --package-manager yarn --yes

      - name: Verify Yarn dependency tree
        working-directory: host
        run: |
          yarn list --pattern '@liwip/(store-core|react-native-cashfree|react-native-store)'
          node -e "const manifest=require('./package.json'); const version=process.env.RELEASE_VERSION; const names=['@liwip/store-core','@liwip/react-native-cashfree','@liwip/react-native-store']; if (manifest.resolutions) throw new Error('Yarn resolutions must not be required'); for (const name of names) { const installed=require('./node_modules/'+name+'/package.json').version; if (installed !== version) throw new Error(name+' resolved to '+installed); const source=manifest.dependencies[name]; if (!source.includes('/releases/download/'+process.env.RELEASE_TAG+'/')) throw new Error(name+' did not resolve from the GitHub Release'); }"
          if [ -n "$RELEASE_PARTNER" ]; then
            node -e "const fs=require('fs'); const layer=fs.readFileSync('./node_modules/@liwip/react-native-store/lib/module/theme/partner/theme.js','utf8'); const packed=(layer.match(/partnerId = '([a-z0-9-]+)'/)||[])[1]; if (packed !== process.env.RELEASE_PARTNER) throw new Error('store was packed for '+packed+', not '+process.env.RELEASE_PARTNER);"
          fi
